<div class="card">
  <div class="card-body">
    <h5 class="card-title">Add Department</h5>

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">{{ successMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="deptName">Department Name</label>
        <input id="deptName" class="form-control" name="name" [(ngModel)]="name" required />
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-success" type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Add Department' }}
        </button>
        <a class="btn btn-outline-secondary" routerLink="/departments/list">Cancel</a>
      </div>
    </form>
  </div>
</div>
