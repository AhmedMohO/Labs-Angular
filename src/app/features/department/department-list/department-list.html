<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Departments</h5>
      <button class="btn btn-outline-secondary" type="button" (click)="loadDepartments()">
        Refresh
      </button>
    </div>

    @if (loading()) {
      <p class="mb-0">Loading departments...</p>
    } @else if (errorMessage()) {
      <div class="alert alert-danger mb-0" role="alert">{{ errorMessage() }}</div>
    } @else {
      <div class="table-responsive">
        <table class="table table-striped table-bordered mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Courses</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            @for (dept of departments(); track dept.id) {
              <tr>
                <td>{{ dept.id }}</td>
                <td>{{ dept.name }}</td>
                <td>{{ courseCounts()[dept.id] || 0 }}</td>
                <td class="d-flex flex-wrap gap-2">
                  <a class="btn btn-sm btn-info" [routerLink]="['/departments/details', dept.id]">
                    Details
                  </a>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
