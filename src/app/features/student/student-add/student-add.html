<div class="card">
  <div class="card-body">
    <h5 class="card-title">Add Student</h5>

    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="studentName">Name</label>
          <input id="studentName" class="form-control" name="name" [(ngModel)]="name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="studentAge">Age</label>
          <input id="studentAge" class="form-control" type="number" name="age" [(ngModel)]="age" required />
        </div>
        
        <div class="col-md-6">
          <label class="form-label" for="department">Department</label>
          <select id="department" class="form-select" [(ngModel)]="selectedDepartmentId" name="departmentId" (change)="onDepartmentChange()" required>
            <option value="">Select Department</option>
            @for (dept of departments; track dept.id) {
              <option [value]="dept.id">{{ dept.name }}</option>
            }
          </select>
        </div>
        
        <div class="col-md-6">
          <label class="form-label" for="course">Course</label>
          <select id="course" class="form-select" [(ngModel)]="selectedCourseId" name="courseId" [disabled]="!selectedDepartmentId" required>
            <option value="">Select Course</option>
            @for (course of courses; track course.id) {
              <option [value]="course.id">{{ course.name }}</option>
            }
          </select>
        </div>
        
        <div class="col-md-6">
          <label class="form-label" for="degree">Degree</label>
          <input id="degree" class="form-control" type="number" name="degree" [(ngModel)]="degree" min="0" max="100" required />
        </div>
      </div>

      <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-success" type="submit" [disabled]="saving">
          {{ saving ? 'Saving...' : 'Add Student' }}
        </button>
        <a class="btn btn-outline-secondary" routerLink="/students/list">Cancel</a>
      </div>
    </form>
  </div>
</div>
