<div class="card">
	<div class="card-body">
		<h5 class="card-title">Add Student</h5>

		@if (errorMessage) {
			<div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
		}

		<form (ngSubmit)="submit()">
			<div class="row g-3">
				<div class="col-md-6">
					<label class="form-label" for="studentName">Name</label>
					<input id="studentName" class="form-control" name="name" [(ngModel)]="name" required />
				</div>
				<div class="col-md-6">
					<label class="form-label" for="studentAge">Age</label>
					<input id="studentAge" class="form-control" type="number" name="age" [(ngModel)]="age" required />
				</div>
			</div>

			<div class="mt-3 d-flex flex-wrap gap-2">
				<button class="btn btn-success" type="submit" [disabled]="saving">
					{{ saving ? 'Saving...' : 'Add Student' }}
				</button>
				<a class="btn btn-outline-secondary" routerLink="/students/list">Cancel</a>
			</div>
		</form>
	</div>
</div>
