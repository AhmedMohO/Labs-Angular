<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Student List</h5>
      <button class="btn btn-outline-secondary" type="button" (click)="loadStudents()">
        Refresh
      </button>
    </div>

    @if (loading()) {
      <p class="mb-0">Loading students...</p>
    } @else if (errorMessage()) {
      <div class="alert alert-danger mb-0" role="alert">{{ errorMessage() }}</div>
    } @else {
      <div class="table-responsive">
        <table class="table table-striped table-bordered mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Age</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            @for (student of students(); track student.id) {
              <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td class="d-flex flex-wrap gap-2">
                  <a class="btn btn-sm btn-info" [routerLink]="['/students/details', student.id]">
                    Details
                  </a>
                  <a class="btn btn-sm btn-primary" [routerLink]="['/students/update', student.id]">
                    Update
                  </a>
                  <a class="btn btn-sm btn-danger" [routerLink]="['/students/delete', student.id]">
                    Delete
                  </a>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div class="mt-3">
        <a class="btn btn-primary" routerLink="/students/add">Add Student</a>
      </div>
    }
  </div>
</div>
