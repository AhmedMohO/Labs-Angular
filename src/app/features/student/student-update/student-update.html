<div class="card">
  <div class="card-body">
    <h5 class="card-title">Update Student</h5>

    @if (loading()) {
      <p class="mb-0">Loading student...</p>
    } @else {
      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="studentName">Name</label>
            <input id="studentName" class="form-control" name="name" [(ngModel)]="name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="studentAge">Age</label>
            <input id="studentAge" class="form-control" type="number" name="age" [(ngModel)]="age" required />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="department">Department</label>
            <select id="department" class="form-select" [(ngModel)]="selectedDepartmentId" name="departmentId">
              <option value="">Select Department</option>
              @for (dept of departments(); track dept.id) {
                <option [value]="dept.id">{{ dept.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="mt-3 d-flex flex-wrap gap-2">
          <button class="btn btn-primary" type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving...' : 'Save Changes' }}
          </button>
          <a class="btn btn-outline-secondary" [routerLink]="['/students/details', id]">Cancel</a>
        </div>
      </form>
    }
  </div>
</div>
