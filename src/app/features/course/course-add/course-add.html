<div class="card">
  <div class="card-body">
    <h5 class="card-title">Add Course</h5>

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">{{ successMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="courseName">Course Name</label>
          <input id="courseName" class="form-control" name="name" [(ngModel)]="name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="department">Department</label>
          <select id="department" class="form-select" [(ngModel)]="selectedDepartmentId" name="departmentId" required>
            <option value="">Select Department</option>
            @for (dept of departments(); track dept.id) {
              <option [value]="dept.id">{{ dept.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-success" type="submit" [disabled]="saving() || loading()">
          {{ saving() ? 'Saving...' : 'Add Course' }}
        </button>
        <a class="btn btn-outline-secondary" routerLink="/courses/list">Cancel</a>
      </div>
    </form>
  </div>
</div>
